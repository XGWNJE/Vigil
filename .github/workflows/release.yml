name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.VIGIL_KEYSTORE_BASE64 }}" | base64 -d > keystore/vigil.keystore

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          VIGIL_STORE_PASSWORD: ${{ secrets.VIGIL_STORE_PASSWORD }}
          VIGIL_KEY_ALIAS: ${{ secrets.VIGIL_KEY_ALIAS }}
          VIGIL_KEY_PASSWORD: ${{ secrets.VIGIL_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "vigil-${TAG}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 优先用仓库内 release-notes/<tag>.md 作为发行描述（发布流程第 1 步写入）；
          # 缺失时回退到自动生成的提交摘要。
          if [ -f "release-notes/${TAG}.md" ]; then
            gh release create "${TAG}" \
              --title "Vigil ${TAG}" \
              --notes-file "release-notes/${TAG}.md" \
              "vigil-${TAG}.apk"
          else
            gh release create "${TAG}" \
              --title "Vigil ${TAG}" \
              --generate-notes \
              "vigil-${TAG}.apk"
          fi
